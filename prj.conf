CONFIG_QEMU_ICOUNT=n

CONFIG_LOG=y
CONFIG_LOG_BACKEND_UART=y
CONFIG_LOG_PRINTK=y

CONFIG_ASSERT=y

CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_KERNEL_LOG_LEVEL_INF=y
CONFIG_UART_CONSOLE=y

CONFIG_TEST_RANDOM_GENERATOR=y

CONFIG_ZBUS=y
CONFIG_SNTP=y

# Network basic configs
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_DHCPV4=y
CONFIG_NET_SOCKETS=y
CONFIG_DNS_RESOLVER=y

# Wi-Fi
CONFIG_WIFI=y
CONFIG_NET_L2_WIFI_MGMT=y
CONFIG_WIFI_ESP32=y

# ESP32 specific configs
CONFIG_SOC_ESP32=y
CONFIG_SPI=y
CONFIG_PINCTRL=y

CONFIG_WIFI_SSID="IC-ALUNOS"
CONFIG_WIFI_PASSWD="icomputacaoufal"

CONFIG_SNTP_HOSTNAME="pool.ntp.org"

CONFIG_LOCAL_TIME=-3

# Network buffer
CONFIG_HEAP_MEM_POOL_SIZE=65536

# ESP32 DevKit specific
CONFIG_ESP32_WIFI_STA_AUTO_DHCPV4=y
CONFIG_ESP32_PHY_INIT_DATA_IN_PARTITION=y
CONFIG_ESP_SPIRAM=n

# Thread stack sizes for ESP32
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_ZBUS_MSG_SUBSCRIBER_NET_BUF_POOL_SIZE=16

